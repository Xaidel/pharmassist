<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1f7a5c" />
    <title>Pharmassist POC — offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: 'Avenir Next', 'Segoe UI', sans-serif;
        background: #f6f1e7;
        color: #2c241c;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 2rem;
      }

      main {
        max-width: 28rem;
      }

      p:first-child {
        margin: 0;
        color: #1f7a5c;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.75rem 0 0;
        font-family: 'Iowan Old Style', 'Palatino Linotype', serif;
        font-size: 2.5rem;
        line-height: 1;
      }

      p {
        margin: 1.25rem 0 0;
        line-height: 1.7;
        color: #6b5f52;
      }

      button {
        margin-top: 1.75rem;
        min-height: 2.75rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 999px;
        background: #1f7a5c;
        color: #fbf8f1;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Pharmassist POC</p>
      <h1>You are offline.</h1>
      <p>
        The app shell is available, but prices and pharmacy data are not stored
        on this device. Reconnect to continue.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
    </main>
  </body>
</html>
